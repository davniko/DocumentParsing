schema_version: 1
task: bill_of_lading_semantic_v2
objective: seq2seq_teacher_forcing

run:
  run_id: t5gemma2-270m-lora-mpci-bl-combined487-v2
  output_dir: artifacts/kie-training

model:
  architecture: seq2seq_lm
  model_type: t5gemma2
  name_or_path: google/t5gemma-2-270m-270m
  revision: 7c38f16641f455ef0685b18431faf1b17722d5a1
  tokenizer_name_or_path: google/t5gemma-2-270m-270m
  tokenizer_revision: 7c38f16641f455ef0685b18431faf1b17722d5a1
  tokenizer_use_fast: true
  token_env: HF_TOKEN
  local_files_only: false
  trust_remote_code: false
  dtype: bfloat16
  attention_implementation: sdpa
  low_cpu_mem_usage: true
  use_cache: false

prompt:
  path: prompts/kie/bill_of_lading_semantic_v2.txt
  placeholder: "{{document_text}}"
  schema_placeholder: "{{output_schema}}"

dataset:
  format: jsonl
  splits:
    train:
      - path: artifacts/kie-training/datasets/mpci-bl-pilot106-seed42-val10-v1/train.jsonl
        sha256: 2e4b01b06a8ab9dbe136259a45c7f6f5231405c75708939972b5bd6aa9f73302
        records: 96
      - path: artifacts/kie-training/datasets/mpci-bl-followup381-seed42-val50-v1/train.jsonl
        sha256: 011d9aa2114739831139355ff3e80350070a4c29440a9a72120846c99dd5e08f
        records: 331
    validation:
      - path: artifacts/kie-training/datasets/mpci-bl-pilot106-seed42-val10-v1/validation.jsonl
        sha256: c4cb5e80032690c7ef1e2b43886043ff595246fab513796968d8537bd9d29b89
        records: 10
      - path: artifacts/kie-training/datasets/mpci-bl-followup381-seed42-val50-v1/validation.jsonl
        sha256: 87c7f599c4492fe1621243f6bee81a6422e5013bde7647082a985e9682c7d1ed
        records: 50
    test: []
  fields:
    document_id: documentId
    input_text: joinedRawText
    target: target
    input_sha256: joinedRawTextSha256
  preprocessing:
    # Exact pinned-tokenizer maxima across all 487 records are 6,980 source tokens and
    # 2,745 target tokens including terminal EOS. These aligned ceilings preserve every
    # token while remaining well below the pinned model's 32,768-position contract.
    max_source_length: 8192
    max_target_length: 3072
    source_overflow: error
    source_add_special_tokens: true
    num_proc: 4
    batch_size: 16
    load_from_cache_file: true
    cache_dir: artifacts/kie-training/cache/tokenized
    pad_to_multiple_of: 8

peft:
  method: lora
  adapter_name: mpci_bl_semantic_v2
  rank: 32
  alpha: 64
  dropout: 0.05
  bias: none
  use_rslora: true
  init_lora_weights: true
  target_modules_regex: '^model\.(?:encoder\.text_model|decoder)\.layers\.[0-9]+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))$'
  modules_to_save: []
  ensure_weight_tying: false

optimization:
  # The pilot's best held-out field/value F1 occurred at epoch 20. Twenty-five epochs
  # retain five additional epochs for the broader cohort without returning to 60 epochs.
  num_train_epochs: 25.0
  max_steps: -1
  # Batch 2 and 12 accumulation microbatches preserve an effective batch of 24. An
  # optimizer-inclusive probe of the absolute worst padded pair (6,680 source and
  # 2,752 target tokens) peaked at 21.09 GiB allocated / 21.35 GiB reserved on the
  # RTX 4090. Batch 3 OOMed when independent source/target maxima shared a batch.
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 12
  learning_rate: 0.0001
  optimizer: adamw_torch_fused
  optimizer_args: null
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 0.00000001
  lr_scheduler_type: cosine
  lr_scheduler_kwargs: {}
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  label_smoothing_factor: 0.0
  average_tokens_across_devices: true
  seed: 424
  data_seed: 424
  full_determinism: false
  train_sampling_strategy: group_by_length
  length_column_name: input_length

runtime:
  distributed_processes: 1
  require_cuda: true
  cuda_allocator_conf: expandable_segments:True
  bf16: true
  fp16: false
  tf32: true
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false
  torch_compile: false
  torch_compile_backend: null
  torch_compile_mode: null
  torch_empty_cache_steps: null
  skip_memory_metrics: true

dataloader:
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false

evaluation:
  strategy: steps
  # With the current split, batch 2, and accumulation 12, one epoch is 18 optimizer
  # steps. Evaluate and checkpoint every five epochs; on_start runs an adapter-disabled
  # base-model baseline before the first training microbatch.
  steps: 90
  split: validation
  # Batch 4 bounds evaluation memory under the expanded source and target ceilings.
  per_device_batch_size: 4
  on_start: true
  predict_with_generate: true
  generation_do_sample: false
  # The runtime deliberately uses one complete-target ceiling for training and generation.
  generation_max_length: 3072
  generation_num_beams: 1
  generation_repetition_penalty: 1.0
  generation_no_repeat_ngram_size: 0
  generation_length_penalty: 1.0
  generation_early_stopping: false
  accumulation_steps: 1
  early_stopping_patience: null
  early_stopping_threshold: null
  run_final_evaluation: true
  write_predictions_for:
    - validation

checkpoint:
  strategy: steps
  steps: 90
  total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: field_value_f1
  greater_is_better: true
  resume_from_checkpoint: null
  enable_jit_checkpoint: false
  save_only_model: false
  save_on_each_node: false
  restore_callback_states_from_checkpoint: true

logging:
  strategy: steps
  steps: 5
  first_step: true
  report_to:
    - mlflow
  mlflow:
    tracking_uri: http://mlflow-server:5000
    experiment_name: document-ocr-kie
    resume_run_id: null
    log_artifacts: false
    flatten_params: true
    max_log_params: null
    system_metrics: true
    system_metrics_sampling_interval: 1
    system_metrics_samples_before_logging: 1
    tags:
      pipeline: document-ocr-kie
      task: bill-of-lading-semantic-v2
      dataset: mpci-bl-combined487
  structured_log: logs/events.jsonl
  disable_tqdm: false
  log_level: info
  include_num_input_tokens_seen: non_padding
  filter_nan_inf: false
  on_each_node: false
