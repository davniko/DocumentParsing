# Positional-input experiment on unchanged R15 labels: 600 train / 60 validation.
# Same optimization/generation settings as the completed R14 10-epoch compact run.
schema_version: 1
task: bill_of_lading_extraction_v7_reduced
objective: seq2seq_teacher_forcing

run:
  run_id: t5gemma2-270m-mpci-bl-real660-r16-positions-v7-e10-compact-eva-a32-r32-local-sfadamw-v1
  output_dir: artifacts/kie-training

model:
  architecture: seq2seq_lm
  model_type: t5gemma2
  name_or_path: google/t5gemma-2-270m-270m
  revision: 7c38f16641f455ef0685b18431faf1b17722d5a1
  tokenizer_name_or_path: google/t5gemma-2-270m-270m
  tokenizer_revision: 7c38f16641f455ef0685b18431faf1b17722d5a1
  tokenizer_use_fast: true
  token_env: HF_TOKEN
  local_files_only: false
  trust_remote_code: false
  dtype: bfloat16
  attention_implementation: sdpa
  low_cpu_mem_usage: true
  use_cache: false

prompt:
  path: prompts/training/mpci_bl_extraction_v7_positions.txt
  placeholder: "{{document_text}}"
  schema_placeholder: "{{output_schema}}"

task_constraints:
  path: configs/training/production/contracts/mpci_bl_real660_reduced_v7_r16_positions/task-constraints.json
  sha256: b91b7aa002b379889a6f70e9580a695f07d9d977c72cdf873fcc8d3111cc81e9

dataset:
  format: jsonl
  splits:
    train:
      - path: data/curated/mpci-bl-real-v7-reviewed-r16-paddle-positions-660/train.jsonl
        sha256: a3927a4470c9939dd7aecabf7346c98a2c6cce5640af7561a1a72a11c5d37458
        records: 600
    validation:
      - path: data/curated/mpci-bl-real-v7-reviewed-r16-paddle-positions-660/validation.jsonl
        sha256: 14d306aff64e2903a8496d5809279ec42f4e9672b6d50432e72b8d170ec50f68
        records: 60
    test: []
  fields:
    document_id: documentId
    input_text: positionedText
    target: target
    input_sha256: positionedTextSha256
  preprocessing:
    target_format: compact
    max_source_length: 19200
    max_target_length: 5500
    source_overflow: error
    source_add_special_tokens: true
    num_proc: 4
    batch_size: 16
    load_from_cache_file: true
    cache_dir: artifacts/kie-training/cache/tokenized
    pad_to_multiple_of: 8

peft:
  method: lora
  adapter_name: t5gemma2_270m_mpci_bl_real660_r16_positions_v7_e10_compact_eva_a32_r32_local_sfadamw_v1
  rank: 32
  alpha: 32
  dropout: 0.05
  bias: none
  use_rslora: true
  init_lora_weights: eva
  eva:
    # No rank redistribution; rsLoRA scale is 32/sqrt(32) = 5.657.
    rho: 1.0
    tau: 0.99
    whiten: false
    sample_count: 512
    batch_size: 1
    tokens_per_stream: 512
    max_forward_passes: 512
    seed: 20260923
  target_modules_regex: '^model\.(?:encoder\.text_model|decoder)\.layers\.[0-9]+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))$'
  modules_to_save: []
  ensure_weight_tying: false

optimization:
  # 600 rows / microbatch 1 / accumulation 32 = 19 updates/epoch, 190 total.
  num_train_epochs: 10.0
  max_steps: -1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 0.0001
  optimizer: schedule_free_adamw
  optimizer_args: null
  schedule_free_adamw:
    # Fixed warmup retained from the five-epoch config; no external LR decay.
    warmup_steps: 5
    r: 0.0
    weight_lr_power: 2.0
    foreach: true
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 0.00000001
  lr_scheduler_type: constant
  lr_scheduler_kwargs: {}
  warmup_ratio: 0.0
  weight_decay: 0.01
  max_grad_norm: 1.0
  label_smoothing_factor: 0.0
  average_tokens_across_devices: true
  seed: 424
  data_seed: 424
  full_determinism: false
  train_sampling_strategy: group_by_length
  length_column_name: input_length

runtime:
  distributed_processes: 1
  require_cuda: true
  cuda_allocator_conf: expandable_segments:True
  bf16: true
  fp16: false
  tf32: true
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: true
  torch_compile: false
  torch_compile_backend: null
  torch_compile_mode: null
  torch_empty_cache_steps: null
  skip_memory_metrics: true

dataloader:
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false

evaluation:
  # Ignore only value casing; JSON syntax, keys and schema remain strict.
  case_sensitive: false
  strategy: steps
  split: validation
  # Every five epochs: two evaluations at steps 95 and 190.
  steps: 95
  per_device_batch_size: 2
  on_start: false
  predict_with_generate: true
  generation_do_sample: false
  # Pretty validation targets reach 2155 tokens including EOS; shared headroom.
  generation_max_length: 3072
  generation_num_beams: 1
  generation_repetition_penalty: 1.0
  generation_no_repeat_ngram_size: 0
  generation_length_penalty: 1.0
  generation_early_stopping: false
  accumulation_steps: 1
  early_stopping_patience: null
  early_stopping_threshold: null
  run_final_evaluation: false
  write_predictions_for: [validation]

checkpoint:
  strategy: steps
  steps: 95
  total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: field_value_f1
  greater_is_better: true
  resume_from_checkpoint: null
  enable_jit_checkpoint: false
  save_only_model: false
  save_on_each_node: false
  restore_callback_states_from_checkpoint: true

logging:
  strategy: steps
  steps: 5
  first_step: true
  report_to:
    - mlflow
  mlflow:
    tracking_uri: http://mlflow-server:5000
    experiment_name: document-ocr-kie
    resume_run_id: null
    log_artifacts: false
    flatten_params: true
    max_log_params: null
    system_metrics: true
    system_metrics_sampling_interval: 1
    system_metrics_samples_before_logging: 1
    tags:
      pipeline: document-ocr-kie
      task: bill-of-lading-extraction-v7-reduced
      dataset: real660-r16-positions-r15-labels
      input_format: ocr-line-centres-1000
      labels_source: real660-r15-address-punctuation
      validation: real60-new-split-historical-membership-recorded
      lora_rank: "32"
      lora_alpha: "32"
      lora_initialization: eva
      optimizer: schedule-free-adamw
      effective_optimizer_batch: "32"
      epochs: "10"
      target_format: compact
      field_scoring: case-insensitive-values
      projected_optimizer_updates: "190"
      hardware: local-cuda
      microbatch_size: "1"
      gradient_accumulation_steps: "32"
      gradient_checkpointing: "true"
  structured_log: logs/events.jsonl
  disable_tqdm: false
  log_level: info
  include_num_input_tokens_seen: non_padding
  filter_nan_inf: false
  on_each_node: false
