    "doc_32f9c07b429237fab08971eca36781e0f11c3fc331ee2df25bc5049c05578fc8": "Forwarding-agent address projection includes QBZ, a separately mutable forwarding reference; source address/reference ownership needs correction.",
    "doc_058d92bbc08fce97814b33b71d9e5f9700d8a83c595180477b131fb5cafcb8e1": "Source-only package count dependency requires review before synthesis: numeric semantic review required: agent:package:source_declared_count: The source states \"1 Container Said to Contain 20 PACKAGES\" but separately states \"600 BOXES WITH\". The target contains only a quantity of 600 PACKAGE_BOX units, so the source does not establish whether 20 is an outer-package count, a contradictory total, or a different packaging level; no supplied mode faithfully expresses that relationship.",
    "doc_26ccea2924c27fc24c1225e5019237dd79f0794a3a9c3b8732a3e6f04791aa5e": "Source-only package count dependency requires review before synthesis: numbered package surfaces require an explicit cargo quantity contract",
    "doc_38c81d9ca5d1215833131ed2d6a7ee47126675dd3218f1dce34a74caaa2a6b93": "Source-only package count dependency requires review before synthesis: numeric semantic review required: agent:source:package_summary_pallets: The 186 PALLETS shipment total equals the sum of the eight per-container pallet bindings (7×24 plus 18), but pallets have no numeric target leaf and no supplied mode preserves this coupled integer total during scaling; independently scaling and rounding the total and constituents would be invalid.",
    "doc_4d47f5e76baaeed1b39c58cb3515a441cac6fe0e1d1f182963d6857817eb6aef": "Source-only package count dependency requires review before synthesis: numbered package surfaces require an explicit cargo quantity contract",
    "doc_5fe4e9267c1fe200ac548b042a06557d315b155abd3e3ebba3400d3380dd81a2": "Source-only package count dependency requires review before synthesis: numeric semantic review required: agent:source:cargo:pallet_count: The source explicitly states “16 PLTS = 125 CTNS.” This binding is a pallet quantity, while the only corresponding numeric target leaf is the carton quantity 125; no supplied dependency mode expresses this cross-unit relationship without incorrectly freezing or independently scaling coupled shipment quantities.",
    "doc_87e3a902b72415dbd1ef5963ec0358a1f6be65bf909fe815c55e1cae8c67ec14": "Source-only package count dependency requires review before synthesis: numeric semantic review required: agent:package:pallet_assertion: The source prints 7 PALLETS twice as the same shipment package assertion, while the available cargo quantity target leaf is 53 cartons. No supplied dependency mode faithfully relates pallet count to carton quantity because there is no pallet target or explicit pallet-to-carton conversion.",
    "doc_9a78fe15e84a7b91e474a482f951d70a2a0150e0e6f76c4b3fa9fa06a5fde87e": "Source-only package count dependency requires review before synthesis: numbered package surfaces require an explicit cargo quantity contract",
    "doc_ab394650a66101bb8aab99878c0a548a530a21052f6bd28a05d60c3da806de6c": "Source-only package count dependency requires review before synthesis: numeric semantic review required: agent:summary:ibc_count: The source explicitly prints \"3 IBCS\", but the detailed cargo target assigns 24 + 24 + 12 = 60 IBCs. This contradictory shipment package quantity cannot be represented faithfully by the supplied dependency modes.",
    "doc_b2f64fbe5aef1eef6d13a3aa0d81783f35286fe1928d63fee0dc3b739bd1071b": "Source-only package count dependency requires review before synthesis: numeric semantic review required: agent:package:pallet_count: The source binds a pallet count of 2, repeated as the same fact, and separately states “2 PLTS = 3 CTNS.” The structured target contains only the 3-carton quantity and no pallet-count leaf; mapping the distinct pallet count to that carton total would invent a dependency, while freezing it would incorrectly treat a shipment package total as fixed.",
    "doc_cc79735a24cdf94c059ce05365262154fa582ca12fe144b4e26ba460a83311b2": "Source-only package count dependency requires review before synthesis: numbered package surfaces require an explicit cargo quantity contract",
    "doc_d6ad6ca7658c9d0e8818a01c5e5f339e63a67c88c3508dd1c61f40f109049f19": "Source-only package count dependency requires review before synthesis: numeric source grammar is ambiguous: agent:cargo:carton_quantity",
    "doc_d98052338410f8cf321980945f59ead9d50522e42d130b912c8a2a1cadb69a1c": "Source-only package count dependency requires review before synthesis: numeric semantic review required: agent:aux:bulk_package_label: The source surface \"BULK N°1/1\" combines a package ordinal (1) and a total package count (1). The ordinal is not represented by a numeric target leaf, while the total corresponds to the cargo package quantity; no supplied mode can preserve the exact composite surface while distinguishing these dependencies.",
    "doc_e9275395ffd502d904e3dbdd7387b7fec058c33ee58a096a84a5a1166e80ecea": "Source-only package count dependency requires review before synthesis: numeric semantic review required: agent:package:source:pallets: The source surfaces \"5 PALLETS\" and \"FIVE PALLETS\" identify a pallet count, while the only available cargo quantity target leaf is 54 boxes. No pallet-count target leaf or supplied relationship faithfully maps the pallet count to that box quantity.",
    "doc_ee029f3cd846cfad8940064cb6011e2a3fa9e9d098446895b3b57e1458988e76": "Source-only package count dependency requires review before synthesis: numeric semantic review required: agent:package_pallet_count_phrase: The source explicitly states 48 PLTS=362 CTNS, coupling this pallet cargo quantity to the target carton quantity 362. No supplied mode expresses this cross-unit integer relationship, so independently scaling or rounding the pallet count would not faithfully reproduce the source dependency.",
    "doc_faf503b7ed3cc093355419c8d74a9b23d4b03ca940b4bcdcb396211d7ee2dd48": "Source-only package count dependency requires review before synthesis: numeric semantic review required: agent:aux:pallet_total: The shipment-level pallet total 162 is a cargo package quantity absent from the structured target, but it is coupled to the listed per-container pallet counts, which sum to 162. No supplied mode preserves this exact coupled integer relationship while scaling the shipment.",
    "doc_019e61229b6aea313ac98a3db5264ec6697235e94e57cf5d0526c85a19547e87": "Printed source package total 73 depends on row quantities 5+16+16+16+20. The 5-package constituent is not covered by the numeric inventory; source contract review is required, not independent rounding of the total.",
    "doc_72f72794ef19f9a3d28d5c786c0a00e740ea1feeccecd4cd3b610b77868deaa4": "Printed 51-package total has only two 17-package constituent bindings in the compiled numeric inventory. Missing constituent ownership prevents a complete sum contract.",
