    "doc_57995dfc1acd2e1a8ae8bca7dab391acb6957a02e4436f452a10d64b5d2f89fd": "Auxiliary exporter code IDSRG is a five-letter location code assigned to a country-only dependency while the shipper city is JAKARTA. No certified city/location-code relation exists; source-copy replacement is not allowed.",
    "doc_1149521ede78a0527c6a82ca4db69a97a2ad6c6da9a2c6ecb4db9be5d65b7a37": "Cargo group 2 projected description pins the old description owned by mutable cargo groups 0 and 1; missing cross-group dependency.",
