[project]
name = "document-ocr-raw-text-template-experiment"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "document-ocr-pipeline",
  "matplotlib==3.11.1",
  "openai>=3.6,<4",
  "pandas==3.0.5",
  "pydantic==2.13.5",
  "pydantic-ai-slim[openai,retries]==2.36.0",
  "python-dotenv==1.2.3",
  "pyyaml==6.0.3",
  "seaborn==0.13.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.0",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.6",
]

[project.scripts]
raw-text-template-experiment = "raw_text_template_experiment.cli:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raw_text_template_experiment"]

[tool.uv.sources]
document-ocr-pipeline = { path = "../../..", editable = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "ASYNC"]

