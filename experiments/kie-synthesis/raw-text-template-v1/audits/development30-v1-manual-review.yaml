conclusion: >-
  The single certified canary template is locally sound on the inspected surfaces, but a fresh run
  of the same document failed. All nine inspected development failures are real fail-closed
  outcomes. Eight expose anchor ownership or missing source-only topology; none is evidence that a
  carrier was synthesized or swapped. One long document also exceeded structured-output retries.

