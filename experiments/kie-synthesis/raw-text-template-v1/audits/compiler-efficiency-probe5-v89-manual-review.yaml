limitations:
  - >-
    The measured average is exact for this five-document stress cohort but has not yet been shown
    to transfer to 30 new unique documents. Straight-line corpus projections are planning figures,
    not confidence intervals.
  - >-
    Manual inspection is domain-stratified and targeted at known high-risk topology; it is not a
    claim that every one of the 626 physical occurrences was independently reread by a human.
  - >-
    The observed dollar result includes cache discounts from repeating the same documents. Corpus
    planning must use the separately reported cold-cache-write projection unless real new-document
    cache telemetry supports a less conservative estimate. The quality result itself does not rely
    on caching: every compiler and critic response was a fresh model response.
