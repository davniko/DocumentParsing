scope: >-
  Manual paired review of the immutable one-document Luna/GLM extraction traces used by the
  provider-neutral efficiency audit. This review evaluates contract validity, topology, residual
  agent dependence, and where cost moved between compiler and critic. It is not a claim of
  population-level model equivalence.
