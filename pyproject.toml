[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "document-ocr-pipeline"
version = "0.1.0"
description = "Resumable, provenance-preserving GLM-OCR dataset extraction pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite>=0.22,<0.23",
  "boto3[crt]>=1.43,<2",
  "httpx>=0.28,<0.29",
  "pillow>=12.3,<13",
  "pyarrow>=25,<26",
  "pydantic>=2.13,<3",
  "pypdfium2>=5.12,<5.13",
  "pyyaml>=6.0.3,<7",
  "regex>=2026.7.19,<2027",
  "transformers>=5.15,<6",
]

[project.scripts]
document-ocr = "document_ocr.cli:main"
document-ocr-classification-catalog = "document_ocr.classification_catalog_cli:main"
document-ocr-catalog-selection = "document_ocr.catalog_selection_cli:main"
document-ocr-corpus = "document_ocr.corpus_cli:main"
document-ocr-pilot = "document_ocr.pilot_cli:main"
document-ocr-quality-filter = "document_ocr.quality_cli:main"
document-ocr-snapshot = "document_ocr.snapshot_cli:main"
document-ocr-table-view = "document_ocr.table_views.cli:main"
document-kie-label-agents = "document_ocr.labeling_agents.cli:main"
document-kie-label-source = "document_ocr.labeling_agents.source_cli:main"
document-kie-semantic-v3 = "document_ocr.semantic_v3.cli:main"
document-kie-align-datasets = "document_ocr.training.dataset_alignment:main"
document-kie-train = "document_ocr.training.cli:main"

[dependency-groups]
dev = [
  "mypy>=2.3,<3",
  "pypdf>=6.14,<7",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "respx>=0.23,<0.24",
  "ruff>=0.16,<0.17",
  "types-pyyaml>=6.0.12.20260724",
  "types-regex>=2026.7.19.20260720,<2027",
]
train = [
  "accelerate>=1.14,<2",
  "datasets>=5,<6",
  "mlflow-skinny>=3.15.1,<3.16",
  "nvidia-ml-py>=13.610.43,<14",
  "peft>=0.19.1,<0.20",
  "torch>=2.13,<2.14",
]
labeling = [
  "openai>=3.3.1,<3.4",
  "pydantic-ai-slim[openai,retries]>=2.33,<2.34",
  "python-dotenv>=1.2,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/document_ocr"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["document_ocr"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "datasets.*", "mlflow.*", "peft.*", "pypdfium2.*", "pyarrow.*"]
ignore_missing_imports = true
