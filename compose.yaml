name: document-ocr

x-kie-common: &kie-common
  profiles: [training]
  build:
    context: .
    dockerfile: docker/training/Dockerfile
  image: document-ocr/kie-trainer:torch2.13.0-cuda13.0-transformers5.15.0
  working_dir: /workspace
  shm_size: 16gb
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
    HF_HOME: /cache/huggingface
    HF_DATASETS_CACHE: /cache/huggingface/datasets
    PYTORCH_ALLOC_CONF: expandable_segments:True
    TORCHINDUCTOR_CACHE_DIR: /cache/torch-inductor
    TOKENIZERS_PARALLELISM: "false"
  volumes:
    - .:/workspace
    - training-hf-cache:/cache/huggingface
    - training-torch-cache:/cache/torch-inductor

services:
  mlflow-server:
    profiles: [training]
    image: ghcr.io/mlflow/mlflow:v3.15.1@sha256:ea84a0b879f08b35a6f22f22b294024413e780b8fc978eecf5f760ac16cc9ce5
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////mlflow/backend/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - mlflow-server:5000,localhost:5000,127.0.0.1:5000
      - --cors-allowed-origins
      - http://localhost:5000,http://127.0.0.1:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  glm-ocr-vllm:
    build:
      context: .
      dockerfile: docker/vllm/Dockerfile
    image: document-ocr/vllm-openai:v0.26.0-glm-ocr-mtp-89e3c3f-df63cb9
    shm_size: 8gb
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    environment:
      HF_HOME: /root/.cache/huggingface
      VLLM_CACHE_ROOT: /root/.cache/vllm
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
      PYTHONPATH: /opt/document-ocr-src
      DOCUMENT_OCR_VLLM_BUILD_MANIFEST: /opt/document-ocr/vllm-build-manifest.json
    volumes:
      - hf-cache:/root/.cache/huggingface
      - vllm-cache:/root/.cache/vllm
      - ./src:/opt/document-ocr-src:ro
    command:
      - zai-org/GLM-OCR
      - --revision
      - ca5d8b3e287e52589e37c28385d9655ee4372f9d
      - --served-model-name
      - glm-ocr
      - --generation-config
      - vllm
      - --speculative-config.method
      - mtp
      - --speculative-config.num_speculative_tokens
      - "1"
      - --limit-mm-per-prompt
      - '{"image":1}'
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "16"
      - --gpu-memory-utilization
      - "0.90"
      - --api-key
      - ${VLLM_API_KEY:?Set VLLM_API_KEY to a non-public secret}
      - --middleware
      - document_ocr.vllm_contract.runtime_contract_middleware
      - --enable-request-id-headers
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 15m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  kie-tools:
    <<: *kie-common
    command:
      - validate-config
      - --config
      - configs/training/t5gemma2_270m_lora.pilot106.yaml
      - --project-root
      - /workspace

  kie-trainer:
    <<: *kie-common
    command:
      - --help
    depends_on:
      mlflow-server:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
  vllm-cache:
  training-hf-cache:
  training-torch-cache:
  mlflow-data:
