[project]
name = "document-ocr-synthesis-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib==3.11.1",
  "pandas==2.3.3",
  "pydantic==2.13.4",
  "pydantic-ai-slim[openai,retries]==2.36.0",
  "pyyaml==6.0.3",
  "scipy==1.18.1",
  "sdv==1.38.2",
  "seaborn==0.13.2",
  "torch==2.9.1+cpu",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
