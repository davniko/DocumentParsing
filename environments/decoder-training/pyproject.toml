[project]
name = "document-ocr-decoder-training-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  # The immutable PyTorch CUDA base includes spin 0.17, which requires Click <8.4.
  "click==8.3.1",
  "mlflow-skinny==3.15.1",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "regex==2026.7.19",
  "torch==2.11.0",
  "transformers==5.5.0",
  "trl==0.24.0",
  "unsloth==2026.8.22",
]

[tool.uv]
package = false
