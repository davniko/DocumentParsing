[project]
name = "document-ocr-paddle-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3[crt]==1.43.108",
  "paddleocr==3.7.0",
  "paddlex==3.7.2",
  "pillow==12.3.0",
  "pyarrow==25.0.1",
  "pydantic==2.13.5",
  "pypdfium2==5.12.1",
  "psutil==7.2.2",
]

[project.optional-dependencies]
cpu = ["paddlepaddle==3.3.1"]
# Official Paddle BOS origin, rather than its CDN alias; the latter fails TLS here.
gpu = ["paddlepaddle-gpu @ https://paddle-whl.bj.bcebos.com/stable/cu126/paddlepaddle-gpu/paddlepaddle_gpu-3.3.1-cp312-cp312-linux_x86_64.whl"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
